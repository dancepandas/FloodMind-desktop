[package]
name = "floodmind-desktop"
version = "0.2.0"
edition = "2021"

[lib]
name = "floodmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Open files/folders with the OS default application without spawning a shell.
# On Windows this calls ShellExecuteW (no cmd.exe, so no argument-injection).
open = "5"
# Read Explorer-copied file lists (CF_HDROP) so Ctrl+V in the composer can
# attach files the WebView can't see as text/File entries. default-features off
# skips the heavy `image` crate (we only need file_list, not image data).
arboard = { version = "3", default-features = false }
